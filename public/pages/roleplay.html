<div class="rp-header">
  <div class="rp-character-info">
    <span class="rp-avatar" id="rp-avatar"></span>
    <div>
      <strong id="rp-character-name"></strong>
      <p id="rp-character-role" style="font-size:12px;color:var(--text2);margin:0;"></p>
    </div>
  </div>
  <span id="rp-turn-counter" style="font-size:13px;color:var(--text2);"></span>
</div>

<div id="rp-chat-area" class="rp-chat-area"></div>

<p id="rp-status" style="text-align:center;color:var(--text2);font-size:14px;margin:12px 0;"></p>

<div class="controls">
  <button class="mic-pill" id="rp-mic-btn" disabled>&#127908; Bắt đầu nói</button>
</div>
