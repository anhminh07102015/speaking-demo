<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;">
  <h3 style="margin-bottom:16px;">Hồ sơ phát âm của bạn</h3>
  <p id="pron-profile-summary" style="color:var(--text2);font-size:14px;margin-bottom:20px;"></p>

  <div id="pron-profile-empty" class="hidden" style="text-align:center;padding:40px 20px;color:var(--text2);">
    <p style="font-size:48px;margin-bottom:12px;">🎤</p>
    <p>Chưa có dữ liệu phát âm.</p>
    <p style="font-size:13px;margin-top:8px;">Hãy luyện tập ít nhất 3 bài để xem hồ sơ.</p>
  </div>

  <div id="pron-profile-list"></div>
</div>

<div style="margin-top:16px;text-align:center;">
  <button class="btn" id="pron-reset-btn" style="color:#ef4444;border:1px solid #ef4444;background:transparent;padding:8px 20px;border-radius:var(--radius);cursor:pointer;">Xóa dữ liệu phát âm</button>
</div>
